name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  verify-release:
    name: Verify release inputs
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.11
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .github/requirements/ci.txt
      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check -r .github/requirements/ci.txt
      - name: Validate tag and project version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          project_version="$(python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          setup_version="$(python -c 'import pathlib,re; text=pathlib.Path("setup.py").read_text(encoding="utf-8"); match=re.search(r"version=\"([^\"]+)\"", text); print(match.group(1) if match else "")')"
          if [[ "${tag_version}" != "${project_version}" || "${tag_version}" != "${setup_version}" ]]; then
            echo "Tag ${tag_version}, pyproject ${project_version}, and setup.py ${setup_version} must match" >&2
            exit 1
          fi
          echo "version=${tag_version}" >> "${GITHUB_OUTPUT}"
      - name: Download CI-built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist
      - name: Verify package versions and checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/evofactskill-"${RELEASE_VERSION}"-*.whl)
          sdists=(dist/evofactskill-"${RELEASE_VERSION}".tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          python -m twine check "${wheels[@]}" "${sdists[@]}"
          python -m pip install --disable-pip-version-check --target "${RUNNER_TEMP}/release-package" "${wheels[0]}"
          installed_version="$(PYTHONPATH="${RUNNER_TEMP}/release-package" python -c 'import importlib.metadata; print(importlib.metadata.version("evofactskill"))')"
          test "${installed_version}" = "${RELEASE_VERSION}"
          sha256sum dist/* > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Upload checksum manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-checksums
          path: SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest release package
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist
      - name: Generate build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz

  github-release:
    name: Publish GitHub Release
    needs:
      - verify-release
      - attest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist
      - name: Download checksum manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-checksums
          path: release-metadata
      - name: Create immutable GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; refusing to overwrite it." >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.whl \
            dist/*.tar.gz \
            release-metadata/SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --generate-notes \
            --title "EvoFactSkill ${GITHUB_REF_NAME}"

  pypi-publish:
    name: Publish to PyPI
    needs: github-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/evofactskill
    permissions:
      id-token: write
    steps:
      - name: Download verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package
          path: dist
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
