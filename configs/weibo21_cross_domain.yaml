seed: 42

output_dir: outputs/weibo21_cross_domain
skill_store: skills/store_weibo21

data:
  dataset: weibo21
  root: datasets/Weibo21
  train_domains: ["政治", "财经商业", "军事", "科技", "社会生活", "文体娱乐", "医药健康", "教育考试"]
  final_test_domains: ["灾难事故"]
  excluded_domains: ["无法确定"]
  train_sampling: balanced_by_domain
  final_test_samples_per_domain: 100
  static_test_pattern: outputs/static/{dataset}-test-{domain}.json
  require_static_test: true

backend: openai-compatible
model: deepseek-flash
base_url: https://api.deepseek.com/v1
api_key_env: DEEPSEEK_API_KEY
routing_strategy: llm
max_skills_per_item: 3

# DeepSeek official peak rates captured on 2026-09-18. Refresh this dated table
# before a publication run; off-peak billing can be lower.
pricing:
  provider: deepseek
  table_path: pricing/deepseek-2026-09-18-peak.json
  require_cost_for_promotion: true

# run 级预算按整次 run() 调用累加，test 会把全部 955 条测试样本放进一次 run()。
# 每条样本最坏 5 次调用（1 router + ≤3 specialist + 1 judge）、≤12000 token：
# 955 × 5 ≈ 4775 calls、955 × 12000 ≈ 11.5M tokens，这里各留约 2 倍余量。
budget:
  max_calls_per_sample: 8
  max_tokens_per_sample: 40000
  max_cost_per_sample: 1.0

  max_calls_per_run: 10000
  max_tokens_per_run: 30000000
  max_cost_per_run: 100.0

  max_sample_concurrency: 4
  max_global_concurrency: 8

  judge_reserved_calls: 1
  judge_reserved_tokens: 4000
  judge_reserved_cost: 0.10

dag:
  max_nodes: 8
  max_depth: 4
  node_timeout_ms: 180000
  sample_timeout_ms: 600000

execution:
  batch_size: 16
  max_concurrent_samples: 16
  progress: auto

evolution:
  enabled: true
  proposer: llm
  scope: package
  discovery: true
  fallback_to_rule: true
  optimizer_skill: skill_optimizer
  max_reports: 12
  max_skills: 12
  max_text_chars: 8000
  max_instructions_chars: 60000
  max_total_chars: 300000

gate:
  repeats: 3
  min_macro_f1_gain: 0.01
  min_coverage: 0.8
  max_protected_domain_drop: 0.02
  alpha: 0.05
  max_cost_ratio: 1.5

meta_learning:
  enabled: true
  strategy: leave_one_domain_out
  episodes: 8
  meta_test_domain_count: 1
  min_source_domains: 3
  min_valid_episodes: 3
  min_mean_gain: 0.0
  max_negative_transfer_rate: 0.25
  max_worst_domain_drop: 0.02
  min_coverage: 0.8
  max_cost_ratio: 1.5
  max_calibration_increase: 0.05
  confidence_level: 0.95
  allow_specialization: true
  aggregate_across_episodes: true
  enforce_negative_transfer: true
  enforce_worst_domain: true
  checkpoint_path: outputs/weibo21_cross_domain/checkpoint.json
