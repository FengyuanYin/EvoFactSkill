seed: 42
output_dir: outputs/demse-dry-run
skill_store: skills/demse-store
backend: mock
model: mock-v1
base_url: https://api.deepseek.com/v1
meta_evolution: true
max_skills_per_item: 2
gate:
  repeats: 2
  min_macro_f1_gain: 0.0
  min_coverage: 0.5
  max_protected_domain_drop: 0.1
  alpha: 0.1
  max_cost_ratio: 2.0
meta_learning:
  enabled: true
  strategy: repeated_holdout
  episodes: 5
  meta_test_domain_count: 1
  min_source_domains: 3
  min_valid_episodes: 3
  min_mean_gain: 0.0
  max_negative_transfer_rate: 0.25
  max_worst_domain_drop: 0.1
  min_coverage: 0.5
  max_cost_ratio: 2.0
  max_calibration_increase: 0.2
  confidence_level: 0.95
  allow_specialization: true
  aggregate_across_episodes: true
  enforce_worst_domain: true
  checkpoint_path: outputs/demse-dry-run/checkpoint.json
