seed: 42

output_dir: outputs/amtcele_cross_domain
skill_store: skills/store_amtcele

data:
  dataset: amtcele
  root: datasets/AMTCele
  train_domains: ["biz", "edu", "entmt", "polit", "sports", "tech"]
  final_test_domains: ["celebrity"]
  excluded_domains: []

backend: openai-compatible
model: deepseek-flash
base_url: https://api.deepseek.com/v1
api_key_env: DEEPSEEK_API_KEY
routing_strategy: llm
max_skills_per_item: 3

pricing:
  provider: deepseek
  table_path: pricing/deepseek-2026-09-18-peak.json
  require_cost_for_promotion: true

# 同 weibo21_cross_domain.yaml：run 级预算在单次 run() 内累加，
# 默认 1M token / 1000 calls 只够几十条样本，全量 test 会在中途耗尽。
budget:
  max_calls_per_run: 10000
  max_tokens_per_run: 30000000

execution:
  batch_size: 16
  max_concurrent_samples: 4
  progress: auto

evolution:
  enabled: true
  proposer: llm
  scope: package
  discovery: true
  fallback_to_rule: true
  optimizer_skill: skill_optimizer
  max_reports: 12
  max_skills: 12
  max_text_chars: 8000
  max_instructions_chars: 60000
  max_total_chars: 300000

gate:
  repeats: 3
  min_macro_f1_gain: 0.01
  min_coverage: 0.8
  max_protected_domain_drop: 0.02
  alpha: 0.05
  max_cost_ratio: 1.5

meta_learning:
  enabled: true
  strategy: leave_one_domain_out
  episodes: 6
  meta_test_domain_count: 1
  min_source_domains: 3
  min_valid_episodes: 3
  min_mean_gain: 0.0
  max_negative_transfer_rate: 0.25
  max_worst_domain_drop: 0.02
  min_coverage: 0.8
  max_cost_ratio: 1.5
  max_calibration_increase: 0.05
  confidence_level: 0.95
  allow_specialization: true
  aggregate_across_episodes: true
  enforce_negative_transfer: true
  enforce_worst_domain: true
  checkpoint_path: outputs/amtcele_cross_domain/checkpoint.json
